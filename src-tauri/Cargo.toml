[package]
name = "ari-overlay"
version = "0.1.0"
description = "Veylo AI desktop assistant and screen translator"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "veylo-ai"
path = "src/main.rs"

[lib]
name = "ari_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
png = "0.18.1"
base64 = "0.23.1"
tauri-plugin-clipboard-manager = "2"

[features]
default = ["overlay"]
overlay = ["dep:tauri-plugin-global-shortcut"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

# The interactive test app uses a debug build. Optimize image codecs without
# removing diagnostics or changing the application's debugging profile.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package."base64:0.23.1"]
opt-level = 3
[profile.dev.package.ari-overlay]
opt-level = 2
